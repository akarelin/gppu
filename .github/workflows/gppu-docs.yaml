name: gppu docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # the documentation (docs/mkdocs.yaml) into the folder nginx serves at kb.karel.in/gppu/v3/ on trix (RAN trix_kb.conf), copied there
  # over ssh, and the same site to GitHub Pages, which the repository's Pages setting takes from GitHub Actions
  docs:
    runs-on: [self-hosted, linux]
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true   # the home page names the version it documents, from the release tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Documentation
        run: sh docs/publish.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - id: pages
        uses: actions/deploy-pages@v5
