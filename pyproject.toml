[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "tzdata; platform_system == 'Windows'"]
build-backend = "setuptools.build_meta"

[project]
name = "gppu"
dynamic = ["version"]
description = "General Purpose Python Utilities"
authors = [{name = "Alex Karelin"}, {email = "alex@karelin.com"}]   # .. the identity on gppu's commits; one entry with both fills only Author-email
requires-python = ">=3.14"
dependencies = [
    "tzdata; platform_system == 'Windows'",
    "PyYAML",
    "fsspec",
    "Jinja2",
]

[project.urls]
Homepage = "https://github.com/akarelin/gppu"

[project.optional-dependencies]
m365 = ["requests"]
pg = ["psycopg2-binary"]
sql = ["sqlalchemy"]
cache = ["diskcache"]
mqtt = ["aiomqtt"]
iot = ["aiomqtt", "aiohttp"]
chrome = ["selenium>=4.0.0"]
tui = ["textual"]
desktop = ["fusepy"]
serve = ["textual-serve"]
vault-azure = ["azure-identity", "azure-keyvault-secrets"]
# .. gppu.ld and APIApp, uvicorn serving them; httpx for the catalog's and the Lake's file systems over their APIs; and fastapi-querybuilder, installed with --no-deps: its metadata lists poetry, uvicorn and aiosqlite as runtime dependencies
ld = ["fastapi", "uvicorn", "sqlmodel", "sqlalchemy[asyncio]", "psycopg[binary]", "fastapi-pagination", "sqlakeyset", "httpx"]
all = ["requests", "psycopg2-binary", "sqlalchemy", "diskcache", "aiomqtt", "aiohttp", "selenium>=4.0.0", "textual", "fusepy", "textual-serve", "azure-identity", "azure-keyvault-secrets", "fastapi", "uvicorn", "sqlmodel", "sqlalchemy[asyncio]", "psycopg[binary]", "fastapi-pagination", "sqlakeyset", "httpx"]
test-tui = ["pytest", "pytest-asyncio", "textual"]

[tool.setuptools_scm]
# .. Prefix optional: matches the git tag (`gppu/v3.4.6`) AND the already-stripped version (`3.4.6`) that setuptools-scm >=10 re-parses from PKG-INFO on the sdist->wheel build. A prefix-required regex made that fallback fail ("no version found" -> AssertionError) and broke `python -m build`.
tag_regex = "^(?:gppu/v)?(?P<version>.+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "gppu/v*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gppu*"]   # .. statusline and w11 are released on their own (statusline.yml, w11.yml)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.messages_control]
disable = [
    "abstract-method",
    "bad-staticmethod-argument",
    "expression-not-assigned",

    "global-statement",

    "line-too-long",

    "missing-function-docstring",
    "missing-class-docstring",
    "multiple-statements",
   
    "redefined-outer-name",
    "unused-private-member",
]

[tool.pylint.basic]
class-rgx = "^([A-Z][a-zA-Z0-9]*|mixin_[A-Za-z][a-zA-Z0-9]*)$"
good-names = ["_trace_mro"]