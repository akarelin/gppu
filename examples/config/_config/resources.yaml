# Resource types — one row per URI scheme: the resource class an address of that scheme
# is built from, and the grammar of the address in the stems of
# CRAP/_config/topology/connections.yaml.
#
#   class  the resource class for an address of this scheme
#   uri    the address grammar; filled from the connection's row, the share and the path
#
# A connection lists the schemes it serves in `services`; a location's place key names
# the scheme and the connection: sd/s1: SD.Lake is served on sd by s1.

templates:
  resource:
    kind: ResourceType

# -- Files on a box
smb:
  template: resource
  class: SmbShare
  uri: "smb://{host}/{share}/{path}"

sd:
  template: resource
  class: SynologyDrive
  uri: "sd://{share}/{path}"

scp:
  template: resource
  class: Scp
  uri: "scp://{host}/volume1/{share}/{path}"

rsync:
  template: resource
  class: Rsync
  uri: "rsync://{host}/volume1/{share}/{path}"

home:
  template: resource
  class: Sftp
  uri: "ssh://{host}/homes/{username}/{path}"

sftp:
  template: resource
  class: Sftp
  uri: "ssh://{host}/{path}"

file:
  template: resource
  class: LocalFolder
  uri: "file://{host}/{path}"

# -- Cloud files and messages
sharepoint:
  template: resource
  class: Graph
  uri: "m365://{tenant}/{alias}/sharepoint/{share}/{path}"

onedrive:
  template: resource
  class: Graph
  uri: "m365://{tenant}/{alias}/onedrive/{share}/{path}"

teams:
  template: resource
  class: Graph
  uri: "m365://{tenant}/{alias}/teams/{share}/{path}"

exchange:
  template: resource
  class: Graph
  uri: "m365://{tenant}/{alias}/exchange/{share}/{path}"

onenote:
  template: resource
  class: Graph
  uri: "m365://{tenant}/{alias}/onenote/{share}/{path}"

drive:
  template: resource
  class: GoogleDrive
  uri: "google://{tenant}/drive/{share}/{path}"

photos:
  template: resource
  class: GooglePhotos
  uri: "google://{tenant}/photos/{share}/{path}"

mail:
  template: resource
  class: Gmail
  uri: "google://{tenant}/mail/{share}/{path}"

storage:
  template: resource
  class: GoogleCloudStorage
  uri: "gcp://{project}/storage/{share}/{path}"

blob_storage:
  template: resource
  class: AzureBlob
  uri: "azure://{account}/{share}/{path}"

files:
  template: resource
  class: Dropbox
  uri: "dropbox://{share}/{path}"

channels:
  template: resource
  class: Slack
  uri: "slack://{workspace}/{share}/{path}"

chats:
  template: resource
  class: Telegram
  uri: "telegram://{share}/{path}"

repos:
  template: resource
  class: GitRepository
  uri: "github://{user}/{share}/{path}"

vault:
  template: resource
  class: ObsidianVault
  uri: "obsidian://{share}/{path}"

# -- Databases
database:
  template: resource
  class: Database
  uri: "{template}://{host}/{share}/{path}"

jira:
  template: resource
  class: Atlassian
  uri: "atlassian://{tenant}/jira/{share}/{path}"

confluence:
  template: resource
  class: Atlassian
  uri: "atlassian://{tenant}/confluence/{share}/{path}"
