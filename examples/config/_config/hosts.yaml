# Hosts — the machines, as rows. The template builds the default object from the uid:
# its hostname under the site domain, the platforms a session on it runs, the boxes it is
# connected to. A row carries only what differs from every host of its kind, which is
# rare; `seven` answers at 7.c.karel.in, so it says so.
#
#   platforms    the environments a session on this host runs
#   connections  the boxes it is connected to
#   tags         what a template or a row says it is; a macro selects on them

templates:
  _: &_
    kind: Host
    refs: {connections: connections, platforms: platforms}
    hostname: "{{ uid ~ '.' ~ site.domain }}"
    connections: []

  workstation:
    <<: *_
    platforms: [windows, wsl]
    tags: [workstation, windows]

  server:
    <<: *_
    platforms: [debian]
    connections: [s1]
    tags: [server, debian]

  mac:
    <<: *_
    platforms: [macos]
    tags: [workstation, macos]

alex-pc:
  template: workstation

alex-laptop:
  template: workstation

alex-mac:
  template: mac

seven:
  template: server
  hostname: 7.c.karel.in

trix:
  template: server
  connections: [s1, s9]

iot:
  template: server
  connections: [s1, yellow]
