# Locations — where the files live, in the shape of CRAP/_config/topology/locations.yaml,
# and the rules that say where each one is on a host. Hosts.next built these paths in
# its host rules; they belong here, with the locations.
#
#   {uid}:
#     name: {name}
#     template: {template, or the templates applied in order}
#     {scheme}/{connection}: {share}       a place: sd/s1: SD.Lake is the share Synology Drive
#                                          syncs, smb/s1: SD.Lake the share a server mounts
#     local/{platform}: {path}             where it is on a platform, when no rule gives it
#     local/{host}: {path}                 where it is on one host, when that host differs
#     at: {path}                           where it mounts, when not under the box's mount point
#     folders: {name: {path}}              the named folders inside it
#
# The template builds the default object from the uid — its addresses on every
# interface, its path on this host — and every rule is a macro below, so a utility
# asks and never computes: Environment.place(uid), Environment.local_of(address).

# ~~ The rules. Each is a Jinja macro; the templates and the utilities call them by name.
macros: |
  {# Where a location is on a host, in the order the rules apply: the location's own
     place for this host, then for its platform; a share Synology Drive syncs, under the
     platform's Drive root; a share the platform mounts, at its box's mount point; the
     parent platform's place, translated — WSL sees the Windows drives under /mnt. #}
  {% macro place(uid, host, platform) %}
  {%- set p = platforms[platform] -%}
  {%- set location = locations[uid] -%}
  {%- if 'local/' ~ host in location -%}{{ location['local/' ~ host] }}
  {%- elif 'local/' ~ platform in location -%}{{ location['local/' ~ platform] }}
  {%- elif 'sd_root' in p and served(location, 'sd') -%}{{ p.sd_root }}/{{ served(location, 'sd') }}
  {%- elif 'mounts' in p and served(location, 'smb') -%}{{ mount_point(uid) }}
  {%- elif 'from' in p and place(uid, host, p['from']) -%}{{ p.mount }}/{{ place(uid, host, p['from'])[0] | lower }}{{ place(uid, host, p['from'])[2:] }}
  {%- endif -%}
  {% endmacro %}

  {# A named folder inside a location, where the location is on a host. #}
  {% macro folder(uid, inside, host, platform) %}{{ place(uid, host, platform) }}/{{ locations[uid].folders[inside].path }}{% endmacro %}

  {# What a location is served as on one scheme, and by which box. #}
  {% macro served(location, scheme) %}{% for key in location if key.startswith(scheme ~ '/') %}{{ location[key] }}{% endfor %}{% endmacro %}
  {% macro serving(location, scheme) %}{% for key in location if key.startswith(scheme ~ '/') %}{{ key[scheme | length + 1:] }}{% endfor %}{% endmacro %}

  {# Where a mounted location lands: its own `at`, else its box's mount point and the share. #}
  {% macro mount_point(uid) %}
  {%- set location = locations[uid] -%}
  {{- location.at if 'at' in location else connections[serving(location, 'smb')].mount ~ '/' ~ served(location, 'smb') | replace(' ', '') -}}
  {% endmacro %}

  {# A location's address on one scheme, in the grammar resources.yaml declares for it,
     filled from the serving box's row, the share and the path: smb://s1.karel.in/SD.Lake,
     sd://SD.Lake, m365://karelin/alex/onedrive/Documents. Empty when not served so. #}
  {% macro uri(uid, scheme, path='') %}
  {%- set location = locations[uid] -%}
  {%- if served(location, scheme) -%}
  {%- set box = connections[serving(location, scheme)] -%}
  {%- set stems = dict(box, share=served(location, scheme), path=path) -%}
  {{- resources[scheme].uri.format(**stems).rstrip('/') -}}
  {%- endif -%}
  {% endmacro %}

  {# Every address of a location, as a list. #}
  {% macro uris(uid) %}
  {%- set ns = namespace(out=[]) -%}
  {%- for scheme in resources if uri(uid, scheme) -%}
  {%- set ns.out = ns.out + [uri(uid, scheme)] -%}
  {%- endfor -%}
  {{- ns.out -}}
  {% endmacro %}

  {# The location an address is inside of: sd://SD.Lake/inbox is inside the location served
     as SD.Lake on sd. Empty when no location is served so. #}
  {% macro location_of(address) %}
  {%- for uid, location in locations.items() -%}
  {%- for scheme in resources if served(location, scheme) and (address == uri(uid, scheme) or address.startswith(uri(uid, scheme) ~ '/')) -%}
  {{- uid -}}
  {%- endfor -%}
  {%- endfor -%}
  {% endmacro %}

  {# The path on a host of an address: the place of the location it is inside of, then
     what lies below it. Empty when the host does not reach it. #}
  {% macro local_of(address, host, platform) %}
  {%- set uid = location_of(address) -%}
  {%- if uid and place(uid, host, platform) -%}
  {%- for scheme in resources if served(locations[uid], scheme) and address.startswith(uri(uid, scheme)) -%}
  {{- place(uid, host, platform) }}{{ address[uri(uid, scheme) | length:] -}}
  {%- endfor -%}
  {%- endif -%}
  {% endmacro %}

# ~~ Templates — what a row is an instance of. The logic: this is a file service that
#    provides files and folders; its canonical location and path are here; its mirrors
#    are here. A file service is a template naming its scheme; the row computes its
#    canonical address, its mirrors, and its place on this host. Data is data; a Jinja
#    value is what the template computes for the row it is applied to.
templates:
  location:
    kind: Location
    refs: {'*/*': [connections, platforms, hosts]}
    provides: files
    tags: []
    local: "{{ place(uid, Environment.host, Environment.platform) or none }}"
    uris: "{{ uris(uid) }}"
    canonical: "{{ uri(uid, service) }}"
    mirrors: "{{ uris | reject('equalto', canonical) | list }}"

  # A share Synology Drive syncs onto every workstation, and a server mounts.
  synced:
    service: sd
    tags: [synced]

  # A share a server mounts and a workstation does not sync.
  share:
    service: smb
    tags: [share]
    mount: "{{ mount_point(uid) }}"

  # A library of a tenant, synced onto a workstation by its client.
  library:
    service: onedrive
    tags: [library]

  # A repository, checked out where the hosts say.
  repo:
    service: repos
    tags: [repo]

  # A vault, synced onto a workstation.
  vault:
    service: vault
    tags: [vault]

  # A folder that exists on a machine only; its canonical place is where it is here.
  folder:
    service: file
    canonical: "{{ 'file://' ~ Environment.host ~ '/' ~ local if local else none }}"

