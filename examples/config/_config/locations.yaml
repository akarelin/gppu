profile:
  name: Profile
  template: [location, folder]
  local/windows: "C:/Users/Alex"
  local/wsl: "~"
  local/debian: "~"
  local/macos: "~"
  folders:
    bin:
      name: User programs
      path: .local/bin

dev:
  name: Checkouts
  template: [location, folder]
  local/windows: "D:/Dev"
  local/wsl: "~"
  local/debian: "~"
  local/macos: "~"

sd:
  name: SD
  template: [location, synced]
  smb/s1: SD
  sd/s1: SD

sd-lake:
  name: SD.Lake
  template: [location, synced]
  smb/s1: SD.Lake
  sd/s1: SD.Lake
  folders:
    inbox:
      name: Session exports
      path: inbox

sd-agents:
