  sd/s1: SD.agents
  local/trix: /home/alex/SD.agents
  folders:
    memory:
      name: Native memory
      path: memory

public:
  name: Public
  template: [location, share]
  smb/s1: Public
  at: /mnt/Public

everything:
  name: Everything
  template: [location, share]
  smb/s1: Everything

tulaco-m365:
  name: TulaCo - M365
  template: [location, share]
  smb/s9: TulaCo - M365

yellow-config:
  name: Yellow configuration
  template: [location, share]
  smb/yellow: config

onedrive:
