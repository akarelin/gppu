# The shared configuration, in the _creekview.yaml shape: one file per domain, each carrying
# its templates beside its rows. An app includes this file at the top of its own config.yaml
# and has everything at load; nothing here is read by any utility as a file.
#
# A section that carries `templates` is a table. Every other mapping in it is a row keyed
# by its uid; the row names the template it is an instance of — one, or a list applied in
# order — and carries only what differs. A template value written in Jinja renders against
# the merged row; a value the row carries is data. `refs` on a template names the tables a
# row references, and a reference nothing answers fails the load.

# ~~ Platforms — what a session on each one is like. Where things are is not here: a host
#    says what it syncs and mounts, a location says where it is.
#    shell  the shell a session on this platform runs
#    from   the platform this one is seen from — WSL is Windows from Linux — and
#    mount  where it then reaches the other's drives
platforms:
  windows:
    shell: pwsh
  wsl:
    shell: bash
    from: windows
    mount: /mnt
  debian:
    shell: bash
  macos:
    shell: zsh

resources:   !include resources.yaml
connections: !include connections.yaml
hosts:       !include hosts.yaml
locations:   !include locations.yaml
