# Connections — every box, tenant and account serving the locations, in the shape of
# CRAP/_config/topology/connections.yaml, with the providers as templates. A provider is
# what every connection of its kind offers; a row carries what differs. The address grammar
# per scheme is in resources.yaml; a connection only says which schemes it serves.
#
#   host      what the box is reached at
#   services  the schemes it serves, each a row of resources.yaml
#   dir       the folder its shares are mounted under, on a host that mounts

templates:
  _: &_
    kind: Connection
    refs: {services: resources}

  # -- Private infrastructure
  synology:
    <<: *_
    username: Alex
    credentials: /home/alex/.smbcredentials
    services: [smb, sftp]
    dir: "{{ uid | upper }}"

  hassio:
    <<: *_
    services: [smb]
    dir: "{{ uid }}"

  pg:
    <<: *_
    services: [pg]
    port: 5432

  neo4j:
    <<: *_
    services: [neo4j]
    port: 7687

  obsidian:
    <<: *_
    services: [vault]

  # -- Cloud, tenant-based
  m365:
    <<: *_
    tenant: "{{ uid }}"
    services: [sharepoint, onedrive, teams, exchange, onenote]
    urls:
      sharepoint: "https://{slug}.sharepoint.com"
      onedrive: "https://{slug}-my.sharepoint.com"

  google:
    <<: *_
    tenant: "{{ uid }}"
    services: [drive, photos, mail]

  gcp:
    <<: *_
    services: [storage]

  azure:
    <<: *_
    services: [blob_storage]

  atlassian:
    <<: *_
    tenant: "{{ uid }}"
    services: [jira, confluence]

  # -- Cloud, not tenant-based
  dropbox:
    <<: *_
    services: [files]

  slack:
    <<: *_
    services: [channels]

  telegram:
    <<: *_
    services: [chats]

  github:
    <<: *_
    services: [repos]

