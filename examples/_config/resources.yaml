# Resource types — one row per URI scheme: the resource class an address of that scheme
# is built from, and the grammar it names. A family of schemes is one template, so a row of
# the family is only its template.
#
#   class  the resource class for an address of this scheme
#   uri    the grammar of the address, by name — rendered by the locations rules with the
#          serving connection's row, the scheme, the share and the path
#
# A connection lists the schemes it serves in `services`; a location's place key names
# the scheme and the connection: sd/s1: SD.Lake is served on sd by s1.

# ~~ The grammars, in the stems of CRAP/_config/topology/connections.yaml
uri_templates:
  box:       "smb://{{ host }}/{{ share }}/{{ path }}"
  synced:    "sd://{{ share }}/{{ path }}"
  volume:    "{{ scheme }}://{{ host }}/volume1/{{ share }}/{{ path }}"
  home:      "ssh://{{ host }}/homes/{{ username }}/{{ path }}"
  sftp:      "ssh://{{ host }}/{{ path }}"
  file:      "file://{{ host }}/{{ path }}"
  graph:     "m365://{{ tenant }}/{{ alias }}/{{ scheme }}/{{ share }}/{{ path }}"
  google:    "google://{{ tenant }}/{{ scheme }}/{{ share }}/{{ path }}"
  atlassian: "atlassian://{{ tenant }}/{{ scheme }}/{{ share }}/{{ path }}"
  storage:   "gcp://{{ project }}/storage/{{ share }}/{{ path }}"
  blob:      "azure://{{ account }}/{{ share }}/{{ path }}"
  account:   "{{ scheme }}://{{ share }}/{{ path }}"
  workspace: "slack://{{ workspace }}/{{ share }}/{{ path }}"
  repos:     "github://{{ user }}/{{ share }}/{{ path }}"
  database:  "{{ scheme }}://{{ host }}/{{ share }}/{{ path }}"
  namespace: "{{ scheme }}://{{ path }}"

templates:
  resource: &resource
    kind: ResourceType
    refs: {uri: uri_templates}

  # A namespace of its own: no box serves it, so its address is the scheme and the path
  # inside it. The lake is one; where it physically is on a host is its location's place,
  # and every physical address of a thing in it is a mirror of its lake:// address.
  # `root` names the location the namespace starts at, when it has one.
  namespace:
    <<: *resource
    refs: {uri: uri_templates, root: locations}
    uri: namespace
    logical: true

  # A Microsoft 365 service of a tenant, named by its row: sharepoint, onedrive, teams...
  graph:
    <<: *resource
    class: Graph
    uri: graph

  # A Google service of an account, named by its row: drive, photos, mail.
  google:
    <<: *resource
    class: Google
    uri: google

  # An Atlassian product of a tenant, named by its row: jira, confluence.
  atlassian:
    <<: *resource
    class: Atlassian
    uri: atlassian

  # A share on a Synology volume, reached over the scheme the row names: scp, rsync.
  volume:
    <<: *resource
    class: SynologyVolume
    uri: volume

  # A database on a box, reached over the scheme the row names: pg, neo4j.
  database:
    <<: *resource
    class: Database
    uri: database

# -- Files on a box
smb:
  template: resource
  class: SmbShare
  uri: box

sd:
  template: resource
  class: SynologyDrive
  uri: synced

scp:
  template: volume

rsync:
  template: volume

sftp:
  template: resource
  class: Sftp
  uri: sftp

home:
  template: resource
  class: Sftp
  uri: home

file:
  template: resource
  class: LocalFolder
  uri: file

# -- Cloud files and messages
sharepoint:
  template: graph

onedrive:
  template: graph

contacts:
  template: graph

teams:
  template: graph

exchange:
  template: graph

onenote:
  template: graph

drive:
  template: google

photos:
  template: google

mail:
  template: google

storage:
  template: resource
  class: GoogleCloudStorage
  uri: storage

blob_storage:
  template: resource
  class: AzureBlob
  uri: blob

dropbox:
  template: resource
  class: Dropbox
  uri: account

slack:
  template: resource
  class: Slack
  uri: workspace

telegram:
  template: resource
  class: Telegram
  uri: account

repos:
  template: resource
  class: GitRepository
  uri: repos

# -- Databases and work
pg:
  template: database
  class: Postgres

neo4j:
  template: database
  class: Neo4j

jira:
  template: atlassian

confluence:
  template: atlassian

# -- Namespaces of their own
# The lake of text: every document the dumpers write. lake://Contacts/aaron-crayford.md is
# the document wherever the lake is — D:\TextLake here, the share under Dagster.
lake:
  template: namespace
  class: Lake
  root: lake

# The permalink of someone, minted once and independent of every source they were seen in:
# person://aaron-crayford. It addresses the man, not a contact card and not a file; a contact
# in a mailbox is one of the sources that mention him.
person:
  template: namespace
  class: Person
  provides: entities

company:
  template: namespace
  class: Company
  provides: entities
