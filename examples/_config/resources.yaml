# Resource types — one row per URI scheme: the resource class an address of that scheme
# is built from, and the grammar of the address in the stems of
# CRAP/_config/topology/connections.yaml.
#
#   class  the resource class for an address of this scheme
#   uri    the address grammar; filled from the connection's row, the share and the path
#
# A family of schemes is one template: its grammar is computed from the row's uid, so a
# row of the family is only its template. A connection lists the schemes it serves in
# `services`; a location's place key names the scheme and the connection: sd/s1: SD.Lake
# is served on sd by s1.

templates:
  resource: &resource
    kind: ResourceType

  # A Microsoft 365 service of a tenant, named by its row: sharepoint, onedrive, teams...
  graph:
    <<: *resource
    class: Graph
    uri: "{{ 'm365://{tenant}/{alias}/' ~ uid ~ '/{share}/{path}' }}"

  # A Google service of an account, named by its row: drive, photos, mail.
  google:
    <<: *resource
    class: Google
    uri: "{{ 'google://{tenant}/' ~ uid ~ '/{share}/{path}' }}"

  # An Atlassian product of a tenant, named by its row: jira, confluence.
  atlassian:
    <<: *resource
    class: Atlassian
    uri: "{{ 'atlassian://{tenant}/' ~ uid ~ '/{share}/{path}' }}"

  # A share on a Synology volume, reached over the scheme the row names: scp, rsync.
  volume:
    <<: *resource
    class: SynologyVolume
    uri: "{{ uid ~ '://{host}/volume1/{share}/{path}' }}"

  # A database on a box, reached over the scheme the row names: pg, neo4j.
  database:
    <<: *resource
    class: Database
    uri: "{{ uid ~ '://{host}/{share}/{path}' }}"

# -- Files on a box
smb:
  template: resource
  class: SmbShare
  uri: "smb://{host}/{share}/{path}"

sd:
  template: resource
  class: SynologyDrive
  uri: "sd://{share}/{path}"

scp:
  template: volume

rsync:
  template: volume

sftp:
  template: resource
  class: Sftp
  uri: "ssh://{host}/{path}"

home:
  template: resource
  class: Sftp
  uri: "ssh://{host}/homes/{username}/{path}"

file:
  template: resource
  class: LocalFolder
  uri: "file://{host}/{path}"

# -- Cloud files and messages
sharepoint:
  template: graph

onedrive:
  template: graph

teams:
  template: graph

exchange:
  template: graph

onenote:
  template: graph

drive:
  template: google

photos:
  template: google

mail:
  template: google

storage:
  template: resource
  class: GoogleCloudStorage
  uri: "gcp://{project}/storage/{share}/{path}"

blob_storage:
  template: resource
  class: AzureBlob
  uri: "azure://{account}/{share}/{path}"

files:
  template: resource
  class: Dropbox
  uri: "dropbox://{share}/{path}"

channels:
  template: resource
  class: Slack
  uri: "slack://{workspace}/{share}/{path}"

chats:
  template: resource
  class: Telegram
  uri: "telegram://{share}/{path}"

repos:
  template: resource
  class: GitRepository
  uri: "github://{user}/{share}/{path}"

vault:
  template: resource
  class: ObsidianVault
  uri: "obsidian://{share}/{path}"

# -- Databases and work
pg:
  template: database
  class: Postgres

neo4j:
  template: database
  class: Neo4j

jira:
  template: atlassian

confluence:
  template: atlassian
