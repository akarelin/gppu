# Hosts — the machines, as rows. The template builds the default object from the uid: its
# hostname under the domain, the platforms a session on it runs, the boxes it is connected
# to, where it puts what it syncs and what it mounts. A row carries only what differs from
# every host of its kind, which is rare; `seven` answers at 7.c.karel.in, so it says so.
#
#   platforms    the environments a session on this host runs
#   connections  the boxes it is connected to
#   sync         where the Synology Drive client on this host puts a share it syncs
#   mount        where this host mounts shares, under the box's folder
#   tags         what a template or a row says it is; a macro selects on them

# ~~ The rules. How a command runs on a host: ssh to the account and port its platform
#    answers on, then the platform's run command reading the script from stdin.
macros: |
  {% macro ssh(host, platform) %}
  {%- set p = platforms[platform] -%}
  {{- ['ssh', '-p', p.ssh.port | string, p.ssh.user ~ '@' ~ hosts[host].hostname] + p.run -}}
  {% endmacro %}

templates:
  _: &_
    kind: Host
    refs: {connections: connections, platforms: platforms}
    domain: c.karel.in
    hostname: "{{ uid ~ '.' ~ domain }}"
    connections: []

  workstation:
    <<: *_
    platforms: [windows, wsl]
    sync: "D:"
    tags: [workstation, windows]

  server:
    <<: *_
    platforms: [debian]
    connections: [s1]
    mount: /mnt
    tags: [server, debian]

  mac:
    <<: *_
    platforms: [macos]
    connections: [s1]
    mount: /Volumes
    tags: [workstation, macos]

alex-pc:
  template: workstation

alex-laptop:
  template: workstation

alex-mac:
  template: mac

seven:
  template: server
  hostname: 7.c.karel.in

trix:
  template: server
  connections: [s1, s9]

iot:
  template: server
  connections: [s1, yellow]
